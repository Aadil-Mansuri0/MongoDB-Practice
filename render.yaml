services:
  - type: web
    name: student-management-performance-api
    runtime: node
    plan: free
    region: singapore
    rootDir: final-project-student-management-api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
